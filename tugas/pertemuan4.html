<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertemuan 4 - Score, Timer & Game State</title>
  <link rel="stylesheet" href="pertemuan4.css">
</head>
<body>
  <h1>Pertemuan 4: Score, Timer & Game State</h1>

  <div class="info-bar">
    <span>Target Menang: 100 Poin</span>
    <span>Koin: +20 Poin</span>
    <span>Bahaya: -10 Poin</span>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <div class="controls">
    <button id="startBtn" class="btn btn-start">START</button>
    <button id="restartBtn" class="btn btn-restart hidden">RESTART</button>
  </div>

  <script src="pertemuan4.js"></script>
</body>
</html>
